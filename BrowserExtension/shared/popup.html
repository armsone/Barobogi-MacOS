<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Barobogi 웹 번역</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <strong>Barobogi 웹 번역</strong>
    <span id="engine" class="pill">확인 중</span>
  </header>

  <section id="consent" hidden>
    <p>페이지 글자와 보이는 탭 화면을 이 Mac의 Barobogi 앱으로 보내 번역합니다.</p>
    <button id="agree" class="primary">동의하고 사용</button>
  </section>

  <section id="main" hidden>
    <div class="switch" id="viewSwitch" role="group" aria-label="번역 보기 전환">
      <button id="googlePage" class="switchSide providerSide" aria-label="구글" title="현재 페이지의 글자와 이미지에서 인식한 글자를 Google로 번역합니다. 이미지 자체는 이 Mac에서 처리합니다."><span id="googleSpinner" class="spinner" hidden aria-hidden="true"></span><img class="providerLogo googleLogo" src="provider-logos/google-translate.png" alt="" width="18" height="18"><span>구글</span></button>
      <button id="deeplPage" class="switchSide providerSide" aria-label="딥플" title="현재 페이지의 글자와 이미지에서 인식한 글자를 DeepL로 번역합니다. 이미지 자체는 이 Mac에서 처리합니다."><span id="deeplSpinner" class="spinner" hidden aria-hidden="true"></span><img class="providerLogo deeplLogo logoLight" src="provider-logos/deepl-symbol-blue.svg" alt=""><img class="providerLogo deeplLogo logoDark" src="provider-logos/deepl-symbol-white.svg" alt=""><span>딥플</span></button>
      <button id="translate" class="switchSide"><span id="translateSpinner" class="spinner" hidden aria-hidden="true"></span><img class="providerLogo" src="icons/icon32.png" alt="" width="18" height="18"><span>번역</span></button>
      <button id="original" class="switchSide"><svg class="originalLogo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg><span>원문</span></button>
    </div>
    <div class="autoRow"><p id="autoStatus" class="auto"></p><button id="langPack" class="linkButton langPackButton" title="시스템 설정 › 일반 › 언어 및 지역 › 번역 언어에서 번역 언어를 받습니다">언어팩</button></div>

    <div class="settings">
      <label class="setting"><span>언어</span>
        <select id="target">
          <option value="ko">한국어</option>
          <option value="en">영어</option>
          <option value="ja">일본어</option>
          <option value="zh-Hans">중국어(간체)</option>
          <option value="zh-Hant">중국어(번체)</option>
        </select>
      </label>
      <label class="setting"><span>글꼴</span>
        <select id="fontStyle" title="자동은 원본 글자 모양으로 추정하며, 애매하면 고딕을 씁니다. 이미지 속 글자 번역은 항상 켜져 있습니다.">
          <option value="auto">자동(기본)</option>
          <option value="gothic">고딕</option>
          <option value="myeongjo">명조</option>
          <option value="gungseo">궁서</option>
          <option value="hand">손글씨</option>
        </select>
      </label>
    </div>
  </section>

  <footer>
    <p id="status" class="status"><span id="spinner" class="spinner" hidden aria-hidden="true"></span><span id="statusText" class="statusText"></span><span id="elapsed" class="elapsed"></span></p>
    <p id="phaseTimes" class="phaseTimes" hidden><span id="translateTime" title="클릭부터 AI 다듬기 시작 직전까지(다듬기가 없으면 완료까지)의 실제 경과 시간"></span><span id="refineTime" title="첫 다듬기 요청부터 마지막 다듬기가 끝날 때까지의 실제 경과 시간(겹친 요청은 한 구간)"></span><span id="summary" class="summary" hidden></span></p>
    <details id="details" class="details" hidden>
      <summary>처리 상세</summary>
      <div id="detailBody"></div>
    </details>
    <p id="error" class="error" hidden></p>
    <p id="fxLine" class="fxLine"><span id="fxText"></span> <a id="fxLink" class="fxLink" href="https://exchangerate.dev" target="_blank" rel="noopener noreferrer" hidden>Rates by Exchangerate.dev</a></p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
